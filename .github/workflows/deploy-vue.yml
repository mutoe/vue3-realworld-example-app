name: deploy vue

on:
  push:
    branches:
      - master

jobs:
  deploy-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      with:
        version: 10
        run install: false
        
      - name: Run pre-deployment commands
        run: |
          sudo apt update
          sudo apt install -y jq
          
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: build the code
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
      - name: copy file to server
        uses: appleboy/scp-action@master
        with:
          host: ${{secrets.HOST}}
          username: ${{secrets.SSH USER NAME}}
          key: ${{secrets.SSH_KEY}}
          source: "./dist/*"
          target: "/var/www/html"
          strip_components: 1